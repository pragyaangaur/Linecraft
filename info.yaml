# Tiny Tapeout project information
project:
  title:        "Linecraft protocol emulator"      # Project title
  author:       "Pragyaan Gaur"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Four programmable shuttles with line-coder transducers and CRC units that bit-bang serial protocols"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 202x155 uM.
  tiles: "8x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2, 3x4, 4x4, 5x4, 6x4 or 8x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_pragyaangaur_linecraft"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "linecraft_host.v"
    - "linecraft_shuttle.v"
    - "linecraft_divider.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "pin 0"
  ui[1]: "pin 1"
  ui[2]: "pin 2"
  ui[3]: "pin 3"
  ui[4]: "pin 4"
  ui[5]: "host MOSI (pin 5)"
  ui[6]: "host SCK (pin 6)"
  ui[7]: "host CSn (pin 7)"

  # Outputs
  uo[0]: "pin 0"
  uo[1]: "pin 1"
  uo[2]: "pin 2"
  uo[3]: "pin 3"
  uo[4]: "pin 4"
  uo[5]: "pin 5"
  uo[6]: "pin 6"
  uo[7]: "host MISO"

  # Bidirectional pins
  uio[0]: "pin 8"
  uio[1]: "pin 9"
  uio[2]: "pin 10"
  uio[3]: "pin 11"
  uio[4]: "pin 12"
  uio[5]: "pin 13"
  uio[6]: "pin 14"
  uio[7]: "pin 15"

# Do not change!
yaml_version: 6
