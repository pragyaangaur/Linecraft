<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="760" height="430" fill="white"/>
  <text x="380" y="17" text-anchor="middle" font-size="15" font-weight="bold">Linecraft: one of four shuttles, and what they share</text>

  <!-- shared blocks -->
  <rect x="20" y="45" width="150" height="70" rx="6" fill="#eef2f7" stroke="#5b7aa1"/>
  <text x="95" y="68" text-anchor="middle" font-weight="bold">Host SPI port</text>
  <text x="95" y="86" text-anchor="middle">ui[7:5], uo[7]</text>
  <text x="95" y="102" text-anchor="middle">15 bit address space</text>

  <rect x="20" y="135" width="150" height="58" rx="6" fill="#eef2f7" stroke="#5b7aa1"/>
  <text x="95" y="158" text-anchor="middle" font-weight="bold">Instruction memory</text>
  <text x="95" y="176" text-anchor="middle">64 x 24 bit, shared</text>

  <rect x="20" y="213" width="150" height="50" rx="6" fill="#eef2f7" stroke="#5b7aa1"/>
  <text x="95" y="236" text-anchor="middle" font-weight="bold">IRQ flags</text>
  <text x="95" y="252" text-anchor="middle">8, shared</text>

  <rect x="20" y="283" width="150" height="70" rx="6" fill="#eef2f7" stroke="#5b7aa1"/>
  <text x="95" y="306" text-anchor="middle" font-weight="bold">Pins</text>
  <text x="95" y="323" text-anchor="middle">2 flop synchronizer in</text>
  <text x="95" y="339" text-anchor="middle">highest shuttle wins out</text>

  <!-- shuttle boundary -->
  <rect x="200" y="45" width="540" height="365" rx="10" fill="none" stroke="#888" stroke-dasharray="6 4"/>
  <text x="725" y="64" text-anchor="end" font-weight="bold" fill="#555">shuttle (x4)</text>

  <rect x="220" y="75" width="150" height="80" rx="6" fill="#fff4e0" stroke="#c8902e"/>
  <text x="295" y="98" text-anchor="middle" font-weight="bold">Program engine</text>
  <text x="295" y="116" text-anchor="middle">PC, X, Y, delay, wrap</text>
  <text x="295" y="132" text-anchor="middle">side-set, 10 opcodes</text>
  <text x="295" y="148" text-anchor="middle">16 jump conditions</text>

  <rect x="400" y="75" width="150" height="80" rx="6" fill="#fff4e0" stroke="#c8902e"/>
  <text x="475" y="98" text-anchor="middle" font-weight="bold">Clock divider</text>
  <text x="475" y="116" text-anchor="middle">16.8 fractional</text>
  <text x="475" y="132" text-anchor="middle">resync on pin edges</text>
  <text x="475" y="148" text-anchor="middle">(clock recovery)</text>

  <rect x="580" y="75" width="140" height="80" rx="6" fill="#fff4e0" stroke="#c8902e"/>
  <text x="650" y="98" text-anchor="middle" font-weight="bold">FIFOs</text>
  <text x="650" y="116" text-anchor="middle">TX 4 bytes</text>
  <text x="650" y="132" text-anchor="middle">RX 4 bytes</text>
  <text x="650" y="148" text-anchor="middle">autopull, autopush</text>

  <rect x="580" y="190" width="140" height="56" rx="6" fill="#fff4e0" stroke="#c8902e"/>
  <text x="650" y="213" text-anchor="middle" font-weight="bold">OSR / ISR</text>
  <text x="650" y="231" text-anchor="middle">32 bit shift registers</text>

  <rect x="400" y="190" width="150" height="56" rx="6" fill="#e3f1e6" stroke="#3d8b51"/>
  <text x="475" y="213" text-anchor="middle" font-weight="bold">CRC unit</text>
  <text x="475" y="231" text-anchor="middle">LFSR, width 1 to 32</text>

  <rect x="220" y="280" width="330" height="110" rx="6" fill="#e3f1e6" stroke="#3d8b51"/>
  <text x="385" y="303" text-anchor="middle" font-weight="bold">Line coder: 16 state transducer</text>
  <text x="385" y="323" text-anchor="middle">entry = next state, out bit, transfer bit, flag</text>
  <text x="385" y="341" text-anchor="middle">transmit: 1 symbol out, 0 or 1 data bit used</text>
  <text x="385" y="359" text-anchor="middle">receive: 1 symbol in, 0 or 1 data bit made</text>
  <text x="385" y="377" text-anchor="middle">NRZI, Manchester, USB, CAN, HDLC, biphase mark ...</text>

  <!-- arrows -->
  <polyline points="170,60 188,60 188,36 650,36 650,72" fill="none" stroke="#444" marker-end="url(#a)"/>
  <text x="420" y="31" text-anchor="middle" fill="#555">program, configuration, tables, FIFO data</text>
  <line x1="170" y1="164" x2="217" y2="125" stroke="#444" marker-end="url(#a)"/>
  <line x1="170" y1="238" x2="217" y2="140" stroke="#444" marker-end="url(#a)"/>
  <line x1="650" y1="155" x2="650" y2="187" stroke="#444" marker-end="url(#a)"/>
  <line x1="650" y1="187" x2="650" y2="157" stroke="#444" marker-end="url(#a)"/>
  <line x1="610" y1="246" x2="550" y2="290" stroke="#444" marker-end="url(#a)"/>
  <line x1="577" y1="218" x2="553" y2="218" stroke="#444" marker-end="url(#a)"/>
  <line x1="400" y1="115" x2="373" y2="115" stroke="#444" marker-end="url(#a)"/>
  <text x="386" y="108" text-anchor="middle" fill="#555" font-size="10">tick</text>
  <line x1="220" y1="335" x2="173" y2="320" stroke="#444" marker-end="url(#a)"/>
  <line x1="173" y1="330" x2="217" y2="350" stroke="#444" marker-end="url(#a)"/>
  <line x1="170" y1="300" x2="397" y2="138" stroke="#444" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="270" y="262" fill="#555">pin edges</text>
</svg>
