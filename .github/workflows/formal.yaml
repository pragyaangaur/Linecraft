name: formal
on: [push, workflow_dispatch]
jobs:
  formal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Yosys and z3
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y yosys z3

      - name: Run the proofs
        run: ./formal/run.sh
